name: ci

# Pull request diverifikasi sebelum merge. Push ke main dan develop tetap
# dijalankan sebagai jaring pengaman, termasuk untuk membuktikan pipeline
# Week 12-14 pada branch pengembangan.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 08-week-8-mid-project-review
          - 09-week-9-ai-assisted-development
          - 10-week-10-ai-feature-integration
          - 11-week-11-performance-optimization
          - 12-week-12-testing-quality-assurance
          - 13-week-13-ci-cd-automation
          - 14-week-14-deployment-monitoring
    name: verify ${{ matrix.project }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Test
        run: flutter test

      - name: Generate Android platform
        if: matrix.project == '13-week-13-ci-cd-automation'
        run: flutter create . --platforms=android

      - name: Ensure Kotlin plugin for AGP 9 template
        if: matrix.project == '13-week-13-ci-cd-automation'
        run: |
          if ! grep -q 'org.jetbrains.kotlin.android' android/app/build.gradle.kts; then
            sed -i 's/id("com.android.application")/id("com.android.application")\n    id("org.jetbrains.kotlin.android")/' android/app/build.gradle.kts
          fi

      - name: Build APK release
        if: matrix.project == '13-week-13-ci-cd-automation'
        run: flutter build apk --release

      - name: Build App Bundle release
        if: matrix.project == '13-week-13-ci-cd-automation'
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        if: matrix.project == '13-week-13-ci-cd-automation'
        uses: actions/upload-artifact@v4
        with:
          name: week13-android-builds
          path: |
            13-week-13-ci-cd-automation/build/app/outputs/flutter-apk/app-release.apk
            13-week-13-ci-cd-automation/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
