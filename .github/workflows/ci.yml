name: ci

# Modul 8 meminta CI berjalan pada Pull Request. Push ke main tetap
# diverifikasi sebagai jaring pengaman rilis. Push ke develop tidak diulang
# karena commit di sana sudah lolos verifikasi PR yang sama.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 08-week-8-mid-project-review
          - 09-week-9-ai-assisted-development
          - 10-week-10-ai-feature-integration
          - 11-week-11-performance-optimization
    name: verify ${{ matrix.project }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test

      - name: Test
        run: flutter test
